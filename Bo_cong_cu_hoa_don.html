<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bộ công cụ hóa đơn</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4F5F2;--surface:#FFFFFF;--ink:#17211D;--muted:#58635D;--line:#E2E5E0;--line-strong:#CDD2CB;
  --accent:#0F6B5C;--accent-ink:#0A4A40;--accent-tint:#E3F1ED;--on-accent:#FFFFFF;
  --ok:#1A6E3F;--ok-tint:#E3F3E8;--warn:#7A5200;--warn-tint:#FFF1CC;--err:#B3261E;--err-tint:#FBE6E4;
  --info:#245B8F;--info-tint:#E4EEF8;--hover:#EEF1EC;--code-bg:#F0F2EE;--shadow:0 1px 2px rgba(23,33,29,.06);
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101513;--surface:#182019;--ink:#E6ECE8;--muted:#9AA8A0;--line:#27322C;--line-strong:#3A473F;
    --accent:#4FC0A8;--accent-ink:#A8E6D8;--accent-tint:#1B3A33;--on-accent:#06231D;
    --ok:#63C48A;--ok-tint:#173324;--warn:#E5B23F;--warn-tint:#3A2E10;--err:#F08A82;--err-tint:#3C1B19;
    --info:#7FB3E6;--info-tint:#182B3F;--hover:#1F2A24;--code-bg:#121915;--shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101513;--surface:#182019;--ink:#E6ECE8;--muted:#9AA8A0;--line:#27322C;--line-strong:#3A473F;
  --accent:#4FC0A8;--accent-ink:#A8E6D8;--accent-tint:#1B3A33;--on-accent:#06231D;
  --ok:#63C48A;--ok-tint:#173324;--warn:#E5B23F;--warn-tint:#3A2E10;--err:#F08A82;--err-tint:#3C1B19;
  --info:#7FB3E6;--info-tint:#182B3F;--hover:#1F2A24;--code-bg:#121915;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
a{color:var(--accent)}a:hover{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.stack>.badge{align-self:flex-start;white-space:normal}

/* khung */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:24px 12px 20px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:4px 12px 0}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;flex:none}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand span{font-size:12.5px;color:var(--muted)}
.nav-group{display:flex;flex-direction:column;gap:4px}
.nav-title{font-size:12.5px;font-weight:600;color:var(--muted);padding:0 12px 4px}
.nav{display:flex;flex-direction:column;gap:20px}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;text-decoration:none;font-weight:500;color:var(--ink)}
.nav a:hover{background:var(--hover)}
.nav a[aria-current="page"]{background:var(--accent-tint);color:var(--accent-ink);font-weight:600}
.side-foot{margin-top:auto;padding:14px;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.side-foot .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.main{padding:32px 40px 56px;display:flex;flex-direction:column;gap:24px;min-width:0;max-width:1240px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap}
.head h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
.head p{margin-top:6px;color:var(--muted);max-width:640px}
.head .actions{display:flex;gap:10px;flex-wrap:wrap}

/* thành phần */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px;min-width:0}
.card>h2,.card-h h2{font-size:16px;font-weight:600;letter-spacing:-.01em}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.split.w21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;font-weight:600;cursor:pointer;white-space:nowrap;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(.94)}
.btn.danger{background:var(--err);color:#fff;border-color:var(--err)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg,.ico{flex:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:500;color:var(--muted)}
.field .hint{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{height:44px;width:100%;padding:0 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink)}
textarea{height:auto;min-height:120px;padding:10px 12px;resize:vertical;line-height:1.5}
.check{display:flex;align-items:flex-start;gap:10px;cursor:pointer;min-height:28px}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.check small{display:block;color:var(--muted);font-size:12.5px}
.check>span{min-width:0;overflow-wrap:anywhere}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:999px;font-size:12.5px;font-weight:600;max-width:100%;white-space:nowrap;background:var(--hover);color:var(--muted)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--ok-tint);color:var(--ok)}
.badge.err{background:var(--err-tint);color:var(--err)}
.badge.warn{background:var(--warn-tint);color:var(--warn)}
.badge.info{background:var(--info-tint);color:var(--info)}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--hover);color:var(--muted);margin-right:4px}
.tag.plx{background:var(--info-tint);color:var(--info)}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;background:var(--surface);min-width:0}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.ok .v{color:var(--ok)}.kpi.err .v{color:var(--err)}.kpi.warn .v{color:var(--warn)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--info-tint);color:var(--ink);border:1px solid transparent}
.banner.warn{background:var(--warn-tint)}
.banner.err{background:var(--err-tint)}
.banner.ok{background:var(--ok-tint)}
.banner b{font-weight:600}
.banner .ico{margin-top:2px;color:var(--info)}
.banner.warn .ico{color:var(--warn)}.banner.err .ico{color:var(--err)}.banner.ok .ico{color:var(--ok)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-tint);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.code{font-family:var(--mono);font-size:12.5px;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;white-space:pre-wrap;word-break:break-all;line-height:1.6;position:relative}
.code-row{display:flex;gap:10px;align-items:flex-start}
.code-row .code{flex:1;min-width:0}
.drop{border:1.5px dashed var(--line-strong);border-radius:12px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--bg);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-tint)}
.drop b{font-weight:600}
.drop .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.bar{height:8px;border-radius:99px;background:var(--hover);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .t{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}

/* bảng */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--bg);text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--hover)}
td.r,th.r{text-align:right}
td.w-nowrap{white-space:nowrap}
td .sub{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
td.cell-warn{background:var(--warn-tint);color:var(--warn);font-weight:500}
td.cell-fix{box-shadow:inset 3px 0 0 var(--accent);background:var(--accent-tint, transparent)}
td[contenteditable]{outline:none}
td[contenteditable]:focus{box-shadow:inset 0 0 0 2px var(--accent);background:var(--surface)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toolbar .search{max-width:300px}
.foot-note{font-size:12.5px;color:var(--muted)}
.list-plain{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.list-plain li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.list-plain li:last-child{border-bottom:none}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:12px;align-items:flex-start}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--accent-tint);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:12.5px;flex:none}
details.card>summary{cursor:pointer;font-weight:600;font-size:16px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.card>summary::-webkit-details-marker{display:none}
details.card[open]>summary{margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:50;max-width:min(92vw,520px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:1100px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split,.split.w21{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:column;gap:12px;padding:14px 16px;border-right:none;border-bottom:1px solid var(--line)}
  .nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .nav-group{flex-direction:row;gap:6px}.nav-title{display:none}
  .nav a{white-space:nowrap;min-height:40px;padding:0 12px}
  .side-foot{display:none}
  .main{padding:20px 16px 48px}
  .g3{grid-template-columns:1fr 1fr}
}
@media (max-width:600px){.g2,.g3,.g4,.g5{grid-template-columns:1fr 1fr}.head h1{font-size:22px}.kpi .v{font-size:22px}.code-row{flex-direction:column}.toolbar .search{max-width:none;width:100%}}
@media (max-width:420px){.g2,.g3{grid-template-columns:1fr}.kpi{padding:12px}}
.banner>div{min-width:0;overflow-wrap:anywhere}

/* 2.0: chọn profile một lần ở thanh bên, menu theo trình tự công việc */
.side-profile{padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.side-profile .lbl{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.side-profile select{height:40px;font-weight:600}
.side-profile .chips{gap:6px}
.side-profile .badge{white-space:normal}
.nav a .stepno{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.nav-badge{margin-left:auto;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--hover);color:var(--muted);font-variant-numeric:tabular-nums}
.nav-badge:empty{display:none}
.nav-badge.warn{background:var(--warn-tint);color:var(--warn)}
.nav-badge.err{background:var(--err-tint);color:var(--err)}
.chip.sm{min-height:30px;padding:0 12px;font-size:13px}
.btn.block{width:100%;min-height:48px;font-size:15px}
details.more{border-top:1px solid var(--line);padding-top:12px}
details.more>summary{cursor:pointer;font-weight:500;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s;flex:none}
details.more[open]>summary::before{transform:rotate(45deg)}
.more-body{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.more-body>.card{box-shadow:none;background:var(--bg)}
.next-list{display:flex;flex-direction:column}
.next-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.next-item:last-child{border-bottom:none}
.next-item small{display:block;color:var(--muted);font-size:12.5px}
.next-n{min-width:48px;text-align:center;font-weight:700;font-size:18px;padding:4px 8px;border-radius:10px;font-variant-numeric:tabular-nums;background:var(--hover);color:var(--muted)}
.next-n.err{background:var(--err-tint);color:var(--err)}.next-n.warn{background:var(--warn-tint);color:var(--warn)}
.next-n.info{background:var(--info-tint);color:var(--info)}.next-n.ok{background:var(--ok-tint);color:var(--ok)}
.stackbar{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;background:var(--hover)}
.stackbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.folder-n{font-size:26px;font-weight:600;letter-spacing:-.02em}
.folder-n small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
tr.current td{background:var(--accent-tint)}
.kv{display:grid;grid-template-columns:minmax(120px,auto) minmax(0,1fr);gap:8px 16px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
@media (max-width:900px){.nav a .nav-badge{margin-left:6px}}
@media (max-width:600px){.next-item{grid-template-columns:auto minmax(0,1fr)}.next-item>.btn{grid-column:1 / -1}.kv{grid-template-columns:1fr}}

</style>
<div id="root"></div>

/* Trích xuất hóa đơn — chuyển từ scan_pdf_v26.py (phần xử lý văn bản, không phụ thuộc trình duyệt) */
(function (root) {
  'use strict';

  var COLUMNS = ["Ten file", "Nha phat hanh", "Loai PDF", "Tên đơn vị mua", "Mã số thuế bên mua", "Ký hiệu",
    "Số hóa đơn", "Ngày hóa đơn", "Cộng tiền hàng", "Biển số xe", "Tên hàng hóa, dịch vụ", "Nguon"];

    var parts = String(s == null ? '' : s).split(/\r\n|[\n\r\v\f\x1c-\x1e\x85\u2028\u2029]/);
    if (parts.length && parts[parts.length - 1] === '') parts.pop();
    return parts;
  }
  function zfill(s, n) { s = String(s); while (s.length < n) s = '0' + s; return s; }
  function lstripZeros(s) { return String(s).replace(/^0+/, ''); }
  function stripChars(s, chars) {
    var a = 0, b = s.length;
    while (a < b && chars.indexOf(s[a]) >= 0) a++;
    while (b > a && chars.indexOf(s[b - 1]) >= 0) b--;
    return s.slice(a, b);
  }
  function rstripChars(s, chars) {
    var b = s.length;
    while (b > 0 && chars.indexOf(s[b - 1]) >= 0) b--;
    return s.slice(0, b);

        var o = mapRow(r);
        var p = r.petro, code = p && p.ma_tra_cuu ? String(p.ma_tra_cuu).replace(/\*+$/, '') : '';

    IM.busy = false; region.update();
  }
  function importWeb(items, _then, region, listRegion) {
    var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
    var stamp = p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    if (S.sample) { S.rows = []; S.sample = false; S.name = 'Danh sách nhập tay'; S.done = new Set(); S.sel = new Set(); if (S.masterSample) { S.master = null; S.masterNames = []; if (masterInfoRef) masterInfoRef.update(); } }
    items.forEach(function (it) { S.manualN++; S.rows.push({ row: 0, mail_date: stamp, sender: '', subject: 'Nhập từ file', so_hoa_don: it.so, ma_tra_cuu: it.ma + '*', pdf_file: '', email_id: '#file-' + S.manualN, downloaded: false }); });
    IM.items = []; IM.source = ''; IM.note = '';
    listRegion.update(); if (cmdRegionRef) cmdRegionRef.update(); region.update();
    U.toast('Đã thêm ' + items.length + ' mã vào danh sách. Dùng lệnh --download-petro ở dưới để tải (cần chạy app.py để thêm thẳng vào sổ).');
  }

  // ================= Chế độ chạy cùng app.py: đọc thẳng sổ Petro của profile =================
  // src: 'manual' = mã nhập thủ công (thư mục riêng) | 'profile' = hóa đơn Petrolimex từ email của profile đang chọn
  var LS = { src: 'manual', rows: [], manualRows: [], loading: false, error: '', profile: null, filter: 'ALL', q: '', sel: new Set(), shown: 200 };
  function target() { return LS.src === 'profile' ? Local.profile : Local.petroManualId(); }
  var LST = { pending: ['warn', 'Chờ tải'], failed: ['err', 'Tải lỗi'], done: ['ok', 'Đã tải'], dup: ['info', 'Trùng'], nocode: ['err', 'Thiếu dữ liệu'] };
  function localState(r) {
    if (!r.ma_tra_cuu) return 'nocode';
    var s = String(r.pdf_status || 'PENDING').toUpperCase();
    if (s === 'DONE') return 'done';
    if (s === 'DUPLICATE') return 'dup';
    if (s === 'FAILED') return 'failed';
    return 'pending';
  }
  function localDetail(r, st) {
    if (st === 'done') return (r.pdf_error === 'MANUAL' ? 'Đã đánh dấu tải tay' : (r.pdf_file || 'Đã có PDF'));
    if (st === 'dup') return r.dup_of === 'MASTER' ? 'Đã có trong file tổng, không tải lại' : 'Trùng với email ' + r.dup_of + ', không tải lại';
    if (st === 'failed' && /Không tồn tại/.test(r.pdf_error || '')) return 'Petrolimex báo không tồn tại hóa đơn với mã này: ' + (/^nhap-tay-/.test(r.message_id || '') ? 'kiểm tra lại mã tra cứu' : 'mở email kiểm tra lại mã tra cứu');
    if (st === 'failed') return 'Lần trước lỗi' + (r.pdf_error ? ': ' + r.pdf_error : '') + (r.pdf_attempts ? ' · đã thử ' + r.pdf_attempts + ' lần' : '') + '. Sẽ thử lại khi tải PDF còn thiếu';
    if (st === 'nocode') return 'Email không có mã tra cứu: mở email kiểm tra';
    var src = /^nhap-tay-/.test(r.message_id || '') ? ' · nhập thủ công' : '';
    return (r.so_hoa_don ? 'Chưa tải PDF' : 'Thiếu số hóa đơn, vẫn tra cứu được bằng mã') + src;
  }
  async function loadLocalPetro(region) {
    var pid = target();
    if (!pid) return;
    LS.loading = true;
    try {
      var d = await Local.api('/api/petro?profile=' + encodeURIComponent(pid));
      if (pid !== target()) return;
      if (LS.profile !== pid) { LS.sel = new Set(); LS.filter = 'ALL'; LS.shown = 200; }
      LS.rows = d.rows; LS.error = ''; LS.profile = pid;
      if (pid === Local.petroManualId()) LS.manualRows = d.rows;
    } catch (e) { LS.error = e.message; LS.rows = []; LS.profile = pid; }
    LS.loading = false;
    region.update();
    if (LS.onLoad) LS.onLoad();        // cập nhật nút "Tải PDF còn thiếu (n)" theo danh sách mới
  }
  async function runLocal(action, options) {
    try { await Local.run(action, options, target()); U.toast('Đã bắt đầu: ' + Local.job.title + (LS.src === 'manual' ? ' (mã nhập thủ công)' : '')); if (action === 'download_petro') Local.scrollToRun(); }
    catch (e) { U.toast(e.message); }
  }
  function petroOptions() { return Local.petroOptions(); }

  function localListView(region) {
    if (LS.loading && !LS.rows.length) return h('div.empty', 'Đang đọc sổ Petrolimex…');
    if (LS.error) return U.banner('err', 'Không đọc được sổ Petrolimex.', LS.error);
    var all = LS.rows.map(function (r, i) { var st = localState(r); return { r: r, st: st, i: i, missing: !r.ma_tra_cuu || !r.so_hoa_don }; });
    var cnt = { pending: 0, failed: 0, done: 0, dup: 0, missing: 0 };
    all.forEach(function (x) { cnt[x.st === 'nocode' ? 'missing' : x.st]++; if (x.missing && x.st !== 'nocode') cnt.missing++; });
    var needle = L.asciiLower(LS.q);
    var list = all.filter(function (x) {
      var f = LS.filter;
      var okF = f === 'ALL' || (f === 'todo' && (x.st === 'pending' || x.st === 'failed')) || (f === 'missing' ? x.missing : x.st === f);
      return okF && (!needle || L.asciiLower([x.r.so_hoa_don, x.r.ma_tra_cuu, x.r.message_id].join(' ')).indexOf(needle) >= 0);
    });
    var shown = list.slice(0, LS.shown), running = Local.running();
    var sel = Array.from(LS.sel);
    var search = h('input.search', { type: 'search', placeholder: 'Tìm số hóa đơn hoặc mã tra cứu', value: LS.q, 'aria-label': 'Tìm hóa đơn' });
    search.addEventListener('input', function (e) { LS.q = e.target.value; LS.shown = 200; clearTimeout(search._t); search._t = setTimeout(function () { region.update(); var el = region.el.querySelector('input.search'); if (el) { el.focus(); el.setSelectionRange(LS.q.length, LS.q.length); } }, 250); });
    var table = h('div.tbl-wrap', { style: 'max-height:640px' }, h('table',
      h('thead', h('tr', h('th', { style: 'width:36px' }, ''), h('th', 'Số hóa đơn'), h('th', 'Mã tra cứu'), h('th', 'Ngày nhận'), h('th', 'Trạng thái'), h('th', 'Chi tiết'), h('th', ''))),
      h('tbody', shown.length ? shown.map(function (x) {
        var code = String(x.r.ma_tra_cuu || '').replace(/\*+$/, ''), can = (x.st === 'pending' || x.st === 'failed') && code;
        var cb = can ? h('input', { type: 'checkbox', checked: LS.sel.has(code), 'aria-label': 'Chọn mã ' + code }) : null;
        if (cb) cb.addEventListener('change', function () { if (cb.checked) LS.sel.add(code); else LS.sel.delete(code); region.update(); });
        var b = LST[x.st];
        return h('tr', h('td', cb), h('td.mono.num', x.r.so_hoa_don || '—'),
          h('td', code ? h('span', { style: 'display:inline-flex;gap:8px;align-items:center' }, h('span.mono', x.r.ma_tra_cuu),
            h('button.btn.sm', { type: 'button', 'aria-label': 'Sao chép mã ' + code, style: 'min-height:28px;padding:0 8px', onclick: function () { U.copy(code, 'Đã sao chép mã ' + code); } }, U.icon('copy', 14))) : '—'),
          h('td.w-nowrap.num', x.r.mail_date || '—'), h('td', U.badge(b[0], b[1])), h('td', localDetail(x.r, x.st)),
          h('td', can ? h('button.btn.sm', { type: 'button', disabled: running, onclick: function () { runLocal('mark_petro', { ids: [code] }); } }, 'Đánh dấu đã tải') : null));
      }) : h('tr', h('td', { colspan: '7' }, h('div.empty', LS.rows.length ? 'Không có hóa đơn nào khớp bộ lọc.' : (LS.src === 'manual' ? 'Chưa có mã nhập thủ công nào. Thêm mã ở mục "Thêm mã tra cứu thủ công" phía trên.' : 'Sổ Petrolimex của profile này đang trống. Hóa đơn sẽ xuất hiện sau khi Quét & tải có email Petrolimex.')))))));
    return [
      h('div.grid.g4', U.kpi('Chờ tải', U.fmt.int(cnt.pending + cnt.failed), cnt.failed ? cnt.failed + ' mã lần trước lỗi' : 'có mã tra cứu, chưa có PDF', 'warn'), U.kpi('Đã tải', U.fmt.int(cnt.done), 'đã có PDF', 'ok'),
        U.kpi('Trùng', U.fmt.int(cnt.dup), 'bỏ qua, không tải lại'), U.kpi('Thiếu dữ liệu', U.fmt.int(cnt.missing), 'thiếu số hóa đơn hoặc mã', cnt.missing ? 'err' : '')),
      h('div.toolbar', U.chips([{ id: 'ALL', label: 'Tất cả', count: all.length }, { id: 'todo', label: 'Chờ tải', count: cnt.pending + cnt.failed }, { id: 'done', label: 'Đã tải', count: cnt.done }, { id: 'dup', label: 'Trùng', count: cnt.dup }, { id: 'failed', label: 'Tải lỗi', count: cnt.failed }, { id: 'missing', label: 'Thiếu dữ liệu', count: cnt.missing }],
        LS.filter, function (id) { LS.filter = id; LS.shown = 200; region.update(); }), search),
      table,
      h('div.toolbar', h('span.foot-note', 'Hiển thị ' + U.fmt.int(shown.length) + ' trên ' + U.fmt.int(list.length) + ' hóa đơn'),
        h('div', { style: 'display:flex;gap:10px;flex-wrap:wrap' },
          list.length > shown.length ? h('button.btn.sm', { type: 'button', onclick: function () { LS.shown += 300; region.update(); } }, 'Hiển thị thêm') : null,
          sel.length ? h('button.btn.sm', { type: 'button', onclick: function () { LS.sel = new Set(); region.update(); } }, 'Bỏ chọn') : null,
          sel.length ? h('button.btn.sm.primary', { type: 'button', disabled: running, onclick: function () { runLocal('mark_petro', { ids: sel }); } }, U.icon('check', 16), 'Đánh dấu ' + sel.length + ' mã đã tải') : null))
    ];
  }

  function buildLocal() {
    var out = h('div', { style: 'display:contents' });
    var listRegion = U.region(function (region) { return localListView(region); });
    function srcLabel() { return LS.src === 'manual' ? 'mã nhập thủ công' : 'email của ' + (Local.profile || '?'); }
    var actions = U.region(function () {
      var running = Local.running(), ok = Local.info && Local.info.app.main_found;
      var todo = LS.rows.filter(function (r) { var s = localState(r); return s === 'pending' || s === 'failed'; }).length;
      return [
        h('button.btn', { type: 'button', onclick: function () { Local.openFolder('petro', target()); } }, U.icon('folder', 18), 'Mở thư mục PDF'),
        h('button.btn.primary', { type: 'button', disabled: running || !ok || !todo, onclick: function () { runLocal('download_petro', petroOptions()); } }, U.icon('play', 18), running ? 'Đang chạy…' : 'Tải PDF còn thiếu' + (todo ? ' (' + todo + ')' : ''))
      ];
    });
    actions.el.className = 'actions';
    var headText = U.region(function () {
      return [h('h1', 'Hóa đơn Petrolimex'),
        h('p', 'Tra cứu bằng mã, tự giải CAPTCHA, tải PDF và XML. Đang xem: ' + srcLabel() + '.')];
    }, 'div');

    // --- 1. Cài đặt tải PDF (dùng chung cho mọi nút tải Petrolimex, kể cả bước Petrolimex khi Quét & tải) ---
    var DIR = { edit: false, val: '', err: '', busy: false };
    var dirRegion = U.region(function (region) {
      var m = Local.petroManual();
      if (!DIR.edit) {
        return h('div', { style: 'display:flex;flex-direction:column;gap:8px' },
          h('div', h('b', 'Thư mục lưu mã nhập thủ công'), h('div.mono', { style: 'overflow-wrap:anywhere' }, m.dir || '(chưa có thông tin)')),
          h('div.foot-note', 'PDF, Ket_Qua.xlsx, Excel danh sách và file lỗi của mã nhập thủ công lưu tại đây, tách khỏi thư mục tải của các profile Gmail. Không đối chiếu và không ghi vào file tổng Petro.'),
          h('div', { style: 'display:flex;gap:10px;flex-wrap:wrap' },
            h('button.btn.sm', { type: 'button', onclick: function () { Local.openFolder('petro', Local.petroManualId()); } }, U.icon('folder', 16), 'Mở thư mục'),
            h('button.btn.sm', { type: 'button', disabled: Local.running(), onclick: function () { DIR.edit = true; DIR.val = m.custom ? m.dir : ''; DIR.err = ''; region.update(); } }, 'Đổi thư mục')));
      }
      var inp = h('input', { type: 'text', value: DIR.val, placeholder: 'Để trống: downloads\\Petro_thu_cong', 'aria-label': 'Thư mục lưu mã nhập thủ công' });
      inp.addEventListener('input', function () { DIR.val = inp.value; });
      return h('div', { style: 'display:flex;flex-direction:column;gap:8px' },
        U.field('Thư mục lưu mã nhập thủ công', inp, 'Ví dụ D:\\Hoa_don_khach_gui. Không được trùng thư mục tải của profile Gmail nào. Mã đã nhập vẫn giữ nguyên; PDF tải từ giờ lưu vào thư mục mới.', null),
        DIR.err ? U.banner('err', '', DIR.err) : null,
        h('div', { style: 'display:flex;gap:10px;flex-wrap:wrap' },
          h('button.btn.sm.primary', { type: 'button', disabled: DIR.busy, onclick: async function () {
            DIR.busy = true; region.update();
            try { Local.info = await Local.api('/api/petro/manual-dir', { path: DIR.val.trim() }); DIR.edit = false; DIR.err = ''; U.toast('Đã lưu thư mục mã nhập thủ công'); headText.update(); }
            catch (e) { DIR.err = e.message; }
            DIR.busy = false; region.update();
          } }, 'Lưu'),
          h('button.btn.sm', { type: 'button', onclick: function () { DIR.edit = false; region.update(); } }, 'Hủy')));
    });
    var opts = h('section.card', { 'aria-labelledby': 'pl-opt-h' }, h('h2', { id: 'pl-opt-h' }, 'Cài đặt tải PDF'),
      Local.petroForm('pl-p'),
      h('div.foot-note', 'Dùng cho nút "Tải PDF còn thiếu" và bước Petrolimex khi Quét & tải. Mã tự giải không được ghi "Tải lỗi" và được thử lại ở lần tải sau.'),
      dirRegion.el,
      h('div', { style: 'display:flex;gap:10px;flex-wrap:wrap' },
        h('button.btn.sm', { type: 'button', onclick: function () { Local.openFolder('ket_qua', target()); } }, U.icon('table', 16), 'Mở Ket_Qua.xlsx'),
        h('button.btn.sm', { type: 'button', onclick: mergeXml }, 'Ráp XML còn lại'),
        h('a.btn.sm', { href: LOOKUP_URL, target: '_blank', rel: 'noopener noreferrer' }, U.icon('external', 16), 'Trang tra cứu Petrolimex')));

    // --- 3. Trạng thái từng hóa đơn: xem mã nhập thủ công, hoặc hóa đơn Petrolimex từ email của profile ---
    LS.onLoad = function () { actions.update(); };
    var srcChips = U.region(function () {
      return U.chips([{ id: 'manual', label: 'Mã nhập thủ công' }, { id: 'profile', label: 'Từ email · ' + (Local.profile || '?') }], LS.src, function (id) {
        if (id === LS.src) return;
        LS.src = id; srcChips.update(); headText.update(); actions.update();
        loadLocalPetro(listRegion).then(function () { actions.update(); });
      });
    });

    Local.subscribe(function (ev) {
      if (ev === 'lines' || ev === 'petro') return;
      actions.update(); headText.update(); srcChips.update();
      if (!DIR.edit) dirRegion.update();
      if ((ev === 'profile' && LS.src === 'profile') || ev === 'jobend' || (ev === 'info' && LS.profile === null)) loadLocalPetro(listRegion).then(function () { actions.update(); });
      else listRegion.update();
    });
    if (Local.info) loadLocalPetro(listRegion).then(function () { actions.update(); });

    async function mergeXml() {
      if (Local.running()) { U.toast('Đang chạy, chờ xong rồi thử lại'); return; }
      try {
        var r = await Local.api('/api/petro/merge-xml', { profile: target() });

        else U.toast((r.messages || []).map(function (m) { return m.text; }).join(' ') || 'Xong');
      } catch (e) { U.toast(e.message); }
    }
    out.appendChild(h('header.head', headText.el, actions.el));
    // Thứ tự: 1. Cài đặt tải PDF (kèm tiến độ lần chạy) -> 2. Thêm mã tra cứu thủ công -> 3. Trạng thái từng hóa đơn
    out.appendChild(h('div.split', opts, Local.runPanel({ actions: ['download_petro', 'mark_petro'], emptyText: 'Bấm "Tải PDF còn thiếu" để bắt đầu. Tiến độ từng mã sẽ hiện ở đây.' })));
    out.appendChild(importCard(function (items, thenDl, region) { importLocal(items, thenDl, region, listRegion); }));
    out.appendChild(h('section.card', { 'aria-labelledby': 'pl-list-h' },
      h('div.card-h', h('h2', { id: 'pl-list-h' }, 'Trạng thái từng hóa đơn'), h('button.btn.sm', { type: 'button', onclick: function () { loadLocalPetro(listRegion); } }, 'Tải lại')),
      srcChips.el, listRegion.el));
    return out;
  }

  root.PagePetro = { build: build };
})(window);

</script>
<script>
/* Trang: Kết quả & Tổng hợp (Tong_hop_ket_qua.xlsx, 3 thư mục con, hóa đơn lỗi cần tải lại). Chỉ có khi chạy cùng app.py */
(function (root) {

  function needApp(title) {
    return h('div', { style: 'display:contents' }, U.header(title, ''),
      U.banner('info', 'Trang này cần chạy cùng app.py.', 'Bấm đúp Chay_giao_dien.bat (hoặc chạy python app.py) rồi mở http://127.0.0.1:8765.'));
  }
  root.NeedApp = needApp;

  function build() {
    if (!(Local && Local.on)) return needApp('Kết quả & Tổng hợp');
    var out = h('div', { style: 'display:contents' });
    var headText = U.region(function () {
      return [h('h1', 'Kết quả & Tổng hợp'),
        h('p', 'File Excel cuối cùng' + (Local.profile ? ' của ' + Local.profile : '') + ' và những hóa đơn còn phải xử lý.')];
    }, 'div');

    // ----- Tong_hop_ket_qua.xlsx -----
    var sum = U.region(function () {
      var p = Local.profileInfo();
      if (!p) return h('div.empty', Local.error ? Local.error : 'Đang kết nối app.py…');
      var f = p.folders || {}, ts = Local.tongSummary(f), rw = ts.rows;
      var parts = [['Petrolimex', 'petro', 'var(--accent)'], ['Các hãng khác (có XML)', 'cac', 'var(--info)'], ['Không có XML', 'kh', 'var(--warn)']]
        .map(function (x) { return [x[0], ts.pdf[x[1]], x[2], rw ? (rw[x[1]] || 0) : null]; });
      return [
        h('div.card-h', h('h2', 'Tong_hop_ket_qua.xlsx'),
          h('span.foot-note', f.tong_hop ? 'Cập nhật ' + f.tong_hop : 'Chưa có file. File được tạo sau lần Quét & tải hoặc Ráp XML đầu tiên.')),
        !f.layout ? U.banner('info', 'Profile này chưa bật bố cục thư mục mới.', 'Các thư mục HoaDon_Petrolimex, Cac_hang_khac, Khong_co_XML được dùng từ lần Quét & tải đầu tiên bằng bản 1.9 trở lên. PDF tải trước đó để nguyên chỗ cũ.') : null,
        h('div', { style: 'font-size:15px;font-weight:600' }, ts.text),
        ts.pdfs ? h('div.stackbar', { role: 'img', 'aria-label': parts.map(function (x) { return x[0] + ' ' + x[1] + ' PDF'; }).join(', ') },
          parts.filter(function (x) { return x[1]; }).map(function (x) { return h('i', { style: 'flex:' + x[1] + ';background:' + x[2] }); })) : null,
        h('div.legend.num', parts.map(function (x) { return h('span', { style: '--c:' + x[2] }, x[0] + ' ' + U.fmt.int(x[1]) + ' PDF' + (x[3] !== null ? ' · ' + U.fmt.int(x[3]) + ' hóa đơn' : '')); })),
        ts.gaps.length ? U.banner('info', 'Vì sao số PDF khác số hóa đơn:', ts.gaps.join('; ') + '.') : null,
        ts.trung ? h('div', { style: 'display:flex;gap:10px;align-items:center;flex-wrap:wrap' },
          h('span.foot-note', ts.trung + ' PDF trùng hóa đơn đã có (cùng ký hiệu + số) được chuyển vào thư mục Trung_lap, không tính vào Tổng hợp.'),
          h('button.btn.sm', { type: 'button', onclick: function () { Local.openFolder('trung_lap'); } }, U.icon('folder', 16), 'Mở Trung_lap')) : null,
        h('p.foot-note', 'Muốn sửa số liệu thì sửa trong Ket_Qua.xlsx của từng thư mục. File Tổng hợp được dựng lại mỗi lần chạy, trùng hóa đơn thì lấy số liệu XML.')
      ];
    });

    // ----- 3 thư mục con -----
    var folders = U.region(function () {

/* Trang: Ảnh -> PDF (OCR tiếng Việt, gộp mỗi thư mục thành một PDF) */
(function (root) {
  'use strict';
  var U = root.UI, h = U.h, L = root.Logic, B = root.Browser;
  var IMG_EXT = ['.png', '.jpg', '.jpeg', '.bmp', '.webp'];
  var S = { groups: [], ocr: true, looseName: 'gop', running: false, stop: false, note: '', overall: null, ocrNote: '' };

  function extOf(n) { return L.extOf(n); }
  function baseNoExt(n) { return n.split('.')[0]; } // giống os.path.basename(...).split('.')[0] của bản Python

  function groupsFrom(files) {
    var map = {}, order = [], rootName = '', loose = [];
    files.forEach(function (f) {
      var ext = extOf(f.name);
      var isImg = IMG_EXT.indexOf(ext) >= 0, isPdf = ext === '.pdf';
      if (!isImg && !isPdf) return;
      var parts = f.rel ? f.rel.split('/') : [f.name];
      if (f.rel) { rootName = parts[0]; parts = parts.slice(1); }
      var item = { name: f.name, file: f.file, isImg: isImg };
      if (parts.length === 1) loose.push(item);
      else if (parts.length === 2) { if (!map[parts[0]]) { map[parts[0]] = []; order.push(parts[0]); } map[parts[0]].push(item); }
    });
    var out = [];
    order.sort(function (a, b) { return L.naturalCompare(a, b); }).forEach(function (g) { out.push(mk(g, map[g])); });
    if (loose.length) out.unshift(mk(rootName || null, loose, !rootName));
    return out;
  }
  function mk(name, items, isLoose) {
    return { name: name, isLoose: !!isLoose, images: items.filter(function (i) { return i.isImg; }), pdfs: items.filter(function (i) { return !i.isImg; }),
      status: 'wait', done: 0, result: null, msg: '' };
  }
  function outName(g) { return (g.isLoose ? (S.looseName.trim() || 'gop') : g.name).replace(/[\\/:*?"<>|]/g, '-') + '.pdf'; }

  async function runGroup(g, onTick) {
    g.status = 'run'; g.done = 0; g.msg = ''; g.result = null;
    var useOcr = S.ocr;
    if (useOcr && g.images.length) {
      var ok = await B.ocrInit(4);
      if (!ok) { useOcr = false; S.ocrNote = 'Không tải được OCR ở đây (' + (B.ocrState().error || 'không rõ lý do') + '). Đã tạo PDF không có lớp chữ. Mở file .html trực tiếp trên máy, có Internet, để dùng OCR.'; }

        catch (e) { errors.push(img.name + ': ' + (e.message || e)); }

      for (var i = 0; i < g.pdfs.length; i++) parts.push({ name: g.pdfs[i].name, bytes: await g.pdfs[i].file.arrayBuffer() });
      if (!parts.length) { g.status = 'err'; g.msg = 'Không có file nào chuyển được. ' + errors.slice(0, 2).join(' · '); return; }

        hint: 'Mỗi thư mục con thành một file PDF. Ảnh và PDF rời trong cùng thư mục được gộp chung',
        onFiles: function (files) {

        U.check('Nhận dạng chữ (OCR tiếng Việt và tiếng Anh)', 'PDF tìm kiếm được chữ; chậm hơn. Tắt để chỉ ghép ảnh vào PDF', S.ocr, function (v) { S.ocr = v; }),
        U.field('Tên file khi chọn file rời', h('input', { type: 'text', value: S.looseName, oninput: function (e) { S.looseName = e.target.value; listRegion.update(); } }), 'Không cần gõ .pdf', 'a-name')),
      ocrRegion.el);
    var how = h('section.card', h('h2', 'Cách hoạt động'),
      h('div.steps',
        h('div.step', h('span.n', '1'), h('div', h('b', 'Chuyển ảnh thành PDF. '), 'Cắt lề trắng, phóng ảnh nhỏ lên rộng 1800 điểm, tăng tương phản và độ nét rồi nhận dạng chữ (giống bản Python).')),
        h('div.step', h('span.n', '2'), h('div', h('b', 'Gộp theo thư mục. '), 'Các PDF của một thư mục được sắp xếp theo tên rồi gộp thành một file.')),
        h('div.step', h('span.n', '3'), h('div', h('b', 'Không có file tạm. '), 'Mọi thứ xử lý trong bộ nhớ trình duyệt, nên không cần bước dọn thư mục tạm.'))),
      h('div.foot-note', 'Chưa rõ thứ tự sắp xếp của utils/sorter.py nên trang này sắp xếp theo tên file, số theo giá trị (2 trước 10).'));
    out.appendChild(U.header('Ảnh → PDF', 'Chuyển ảnh hóa đơn thành PDF có thể tìm kiếm chữ (OCR), rồi gộp mỗi thư mục thành một file PDF.'));
    out.appendChild(h('div.split', settings, how));
    out.appendChild(h('section.card', { 'aria-labelledby': 'a-list-h' }, h('h2', { id: 'a-list-h' }, 'Thư mục và kết quả'), listRegion.el));

  }

  function statusBadge(g) {
    return g.status === 'done' ? U.badge('ok', 'Đã gộp') : g.status === 'run' ? U.badge('info', 'Đang xử lý ' + g.done + '/' + g.images.length) : g.status === 'err' ? U.badge('err', 'Lỗi') : U.badge('', 'Chờ xử lý');
  }

    async function runList(list) {

          h('td', g.result ? h('span', outName(g), h('span.sub', U.fmt.bytes(g.result.length) + (g.msg ? ' · ' + g.msg : ''))) : (g.msg || '—')),
          h('td', statusBadge(g)),
          h('td', { style: 'white-space:nowrap' },
            g.result ? h('button.btn.sm', { type: 'button', onclick: function () { U.save(outName(g), new Blob([g.result], { type: 'application/pdf' })); } }, U.icon('download', 16), 'Tải PDF') : null,
            ' ', h('button.btn.sm', { type: 'button', disabled: S.running, onclick: function () { runList([g]); } }, g.result ? 'Chạy lại' : 'Chạy')));

          h('button.btn', { type: 'button', disabled: !doneCount, onclick: downloadAll }, U.icon('download', 16), doneCount > 1 ? 'Tải tất cả (ZIP)' : 'Tải PDF'),

    ];
  }

  root.PageAnhPdf = { build: build };
})(window);

<script>
/* Trang: Quét hóa đơn -> Excel (port của v25.py) */
(function (root) {
  'use strict';
  var U = root.UI, h = U.h, E = root.Extract, S_ = root.Scan, B = root.Browser, L = root.Logic;
  var COLS = E.COLUMNS;

  var S = {
    rows: [], sample: false, source: '', running: false, stop: false, done: 0, total: 0, errNote: '', ocrNote: '', started: 0,
    ocr: true, improve: true, rules: true, workers: '4', filter: 'ALL', shown: 200, fixMst: U.store.get('fix_mst', true) !== false,
    mst: U.store.get('mst', null) || Object.keys(E.DEFAULT_MST_TABLE).map(function (k) { return [k, E.DEFAULT_MST_TABLE[k]]; })
  };
  function mstTable() {
    var t = {};
    S.mst.forEach(function (p) { var k = String(p[0] || '').replace(/\D/g, ''); if (k && String(p[1] || '').trim()) t[k] = String(p[1]).trim(); });
    return t;
  }
  function needs(row, col) {
    if (col === 'Biển số xe' || col === 'Nguon' || col === 'Ten file' || col === 'Nha phat hanh' || col === 'Loai PDF') return false;
    var v = row[col];
    if (col === 'Tên đơn vị mua' && Object.values(mstTable()).indexOf(String(v || '').trim()) >= 0) return false;
    if (col === 'Cộng tiền hàng') return v === 'Cần kiểm tra' || v === null || v === '' || v === undefined || (typeof v === 'number' && v < 100000);
    return E.needsBetterValue(col, v);
  }
  function rowState(r) {
    var bad = r['Nguon'] === 'empty' || r['Nguon'] === 'error';
    if (bad) return 'err';
    var review = false;
    ['Mã số thuế bên mua', 'Ký hiệu', 'Số hóa đơn', 'Ngày hóa đơn', 'Cộng tiền hàng', 'Tên hàng hóa, dịch vụ', 'Tên đơn vị mua'].forEach(function (c) { if (needs(r, c)) review = true; });
    return review ? 'review' : 'ok';
  }

  function finalize(raw) {
    var rows = E.sortRows(raw.slice());
    E.postProcess(rows, { mstTable: mstTable(), rules: S.rules, fixMst: S.fixMst });
    return rows;
  }

  async function runSample() {
    var raw = [];
    for (var i = 0; i < root.SAMPLE_INVOICES.length; i++) {
      var s = root.SAMPLE_INVOICES[i];
      raw = raw.concat(await S_.scanPdf({ name: s.name, numPages: 1, pagesText: [s.text] }, {}, { ocr: false }));
    }
    S.rows = finalize(raw); S.sample = true; S.source = 'Hóa đơn mẫu';
  }

  async function run(files, region) {
    var items = S_.collectInputs(files);
    if (!items.length) { U.toast('Không thấy file PDF hoặc ảnh nào trong lựa chọn của bạn.'); return; }
    S.running = true; S.stop = false; S.done = 0; S.total = items.length; S.errNote = ''; S.ocrNote = ''; S.sample = false; S.source = items.length + ' file'; S.started = Date.now();
    region.update();
    var workers = Math.max(1, parseInt(S.workers, 10) || 2), raw = [], errors = 0;
    var ocrOk = null;
    async function ensureOcr() {
      if (ocrOk === null) {
        ocrOk = S.ocr ? await B.ocrInit(workers) : false;
        if (S.ocr && !ocrOk) S.ocrNote = 'Không tải được OCR ở đây (' + (B.ocrState().error || 'không rõ lý do') + '). PDF và ảnh không có chữ sẽ để trống. Mở file .html trực tiếp trên máy, có Internet, để dùng OCR.';
      }
      return ocrOk;
    }
    var hasImages = items.some(function (i) { return i.ext !== '.pdf'; });
    if (hasImages && S.ocr) { S.ocrNote = ''; region.update(); await ensureOcr(); region.update(); }
    var env = B.makeEnv();
    try {
      await B.mapLimit(items, workers, async function (item) {
        var rows;
        try {
          if (item.ext === '.pdf') {
            var pdf = await B.readPdf(item.name, item.file);
            try {
              var hasText = pdf.pagesText.join('').trim().length > 0;
              var useOcr = (!hasText || S.improve) ? await ensureOcr() : ocrOk === true;
              rows = await S_.scanPdf(pdf, env, { ocr: useOcr, improve: S.improve && useOcr });
            } finally { B.closePdf(pdf); }
          } else {
            var ocr = await ensureOcr();
            rows = await S_.scanImage({ name: item.name, file: item.file, alias: item.alias }, env, { ocr: ocr });
          }
        } catch (e) {
          rows = [Object.assign(E.COLUMNS.reduce(function (o, c) { o[c] = ''; return o; }, {}), { 'Ten file': S_.splitExt(item.name)[0], 'Nguon': 'error', 'Loi': String(e && e.message || e) })];
        }

    } catch (e) { S.errNote = String(e && e.message || e); }
    S.rows = finalize(raw); S.filter = 'ALL'; S.shown = 200; S.running = false;
    region.update();
    U.toast(S.stop ? 'Đã dừng, giữ lại ' + S.rows.length + ' dòng' : 'Xong: ' + S.rows.length + ' dòng từ ' + items.length + ' file');
  }

  // ---------- chạy v25 thật trên máy (qua app.py) ----------
  var N = { folder: U.store.get('v25_folder', ''), workers: '', skip: U.store.get('v25_skip', true), editPath: false, path: '', err: '', busy: false, loaded: '' };
  function cpu() { return (root.Local && Local.info && Local.info.app.cpu) || 4; }
  function defWorkers() { return String(Math.max(4, Math.min(8, cpu()))); }

  async function loadV25Result(job, region) {
    if (!job || job.action !== 'scan_v25' || !job.result || N.loaded === job.id) return;
    N.loaded = job.id;
    try {
      var res = await fetch('/api/v25-result?id=' + encodeURIComponent(job.id), { headers: { 'X-Local-Token': root.LOCAL_API.token }, cache: 'no-store' });
      if (!res.ok) throw new Error('Không đọc được Ket_Qua.xlsx (' + res.status + ')');
      var wb = root.XLSX.read(await res.arrayBuffer(), { type: 'array', cellDates: false });
      var aoa = root.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '', blankrows: false });
      var head = (aoa[0] || []).map(function (x) { return String(x).trim(); });
      S.rows = aoa.slice(1).map(function (line) {
        var r = {};
        COLS.forEach(function (c) { var i = head.indexOf(c); var v = i >= 0 ? line[i] : ''; r[c] = v === undefined || v === null ? '' : v; });
        return r;
      });
      var fixed = {};
      Local.lines.forEach(function (l) { var mm = /^\[UI\]\s{2,}(.+): (\S+) -> (\d{10}) (\S+)$/.exec(l.text || ''); if (mm) fixed[mm[1]] = (mm[2] === '(trong)' ? 'trống' : mm[2]) + ' → ' + mm[3] + ' ' + mm[4]; });
      S.rows.forEach(function (r) { var k = String(r['Ten file']); if (fixed[k]) r['_mst_fix'] = fixed[k]; });
      S.sample = false; S.filter = 'ALL'; S.shown = 200; S.errNote = ''; S.ocrNote = '';
      S.source = 'Ket_Qua.xlsx do v25 tạo trên máy (' + job.result + '), ' + S.rows.length + ' dòng';
      region.update();
    } catch (e) { N.loaded = ''; U.toast(e.message); }
  }

  function nativeCard() {
    var reg = U.region(function (region) {
      var info = Local.info, v25 = info && info.app.v25, running = Local.running();
      var profiles = ((info && info.profiles) || []).filter(function (p) { return p.download_dir; });
      if (!N.workers) N.workers = defWorkers();
      var folderIn = h('input', { type: 'text', value: N.folder, placeholder: 'Ví dụ: downloads\\thp', spellcheck: 'false', oninput: function (e) { N.folder = e.target.value; U.store.set('v25_folder', N.folder); } });
      var opts = [1, 2, 4, 6, 8, 12, 16].filter(function (n) { return n <= Math.max(8, cpu() * 2); });
      if (opts.indexOf(+N.workers) < 0) opts.push(+N.workers);
      var pathBox = null;
      if (!v25 || N.editPath) {
        var pathIn = h('input', { type: 'text', value: N.path || v25 || '', placeholder: 'C:\\...\\gmail_api_project\\v25.py', spellcheck: 'false', oninput: function (e) { N.path = e.target.value; } });
        pathBox = h('div', { style: 'display:flex;flex-direction:column;gap:10px' },
          !v25 ? U.banner('warn', 'Chưa thấy file v25.', 'Đặt v25.py (hoặc scan_pdf_v26.py) cạnh main.py, hoặc nhập đường dẫn file ở dưới.') : null,
          U.field('Đường dẫn file v25', pathIn, 'Nhập đường dẫn file .py hoặc thư mục chứa nó', 'qv-path'),
          h('div', { style: 'display:flex;gap:10px;flex-wrap:wrap' },
            h('button.btn.sm', { type: 'button', disabled: N.busy, onclick: async function () {
              N.busy = true; N.err = ''; region.update();
              try { Local.info = await Local.api('/api/v25/config', { path: N.path || '' }); N.editPath = false; U.toast('Đã lưu đường dẫn v25'); }
              catch (e) { N.err = e.message; }

            } }, 'Lưu đường dẫn'),
            v25 ? h('button.btn.sm', { type: 'button', onclick: function () { N.editPath = false; region.update(); } }, 'Hủy') : null));
      }
      var wsel = h('select', { onchange: function (e) { N.workers = e.target.value; } }, opts.sort(function (a, b) { return a - b; }).map(function (n) { return h('option', { value: String(n), selected: String(n) === N.workers }, n + ' luồng'); }));
      return [
        h('div.card-h', h('h2', 'Quét thư mục trên máy'), U.badge('ok', 'Nhanh')),
        h('p.muted', { style: 'margin:0' }, 'Chạy thẳng file v25 của bạn bằng Python và Tesseract cài trên máy, nên kết quả giống hệt khi chạy v25 bằng tay. Ket_Qua.xlsx được ghi vào chính thư mục đó và hiện trong bảng bên dưới.'),
        v25 && !N.editPath ? h('div.foot-note', { style: 'overflow-wrap:anywhere' }, 'File v25: ' + v25 + ' · ', h('a', { href: '#quet', onclick: function (e) { e.preventDefault(); N.editPath = true; N.path = v25; region.update(); } }, 'Đổi')) : pathBox,
        U.field('Thư mục cần quét', folderIn, 'Đường dẫn tương đối tính từ thư mục main.py', 'qv-folder'),
        profiles.length ? h('div.chips', { role: 'group', 'aria-label': 'Chọn nhanh thư mục tải về', style: 'gap:6px' },
          profiles.map(function (p) { return h('button.chip', { type: 'button', 'aria-pressed': String(N.folder === p.download_dir), onclick: function () { N.folder = p.download_dir; U.store.set('v25_folder', N.folder); region.update(); } }, p.id); })) : null,
        h('div.grid.g2',
          U.field('Số luồng', wsel, 'Máy có ' + cpu() + ' nhân. v25 mặc định ' + Math.max(1, Math.min(8, cpu())) + ' luồng', 'qv-w'),
          U.check('Bỏ qua thư mục HoaDon_Petrolimex', 'Số liệu PDF Petro đã lấy từ XML (Ket_Qua.xlsx riêng trong thư mục đó), không cần OCR lại', N.skip, function (v) { N.skip = v; U.store.set('v25_skip', v); })),
        U.check('Tự sửa MST bên mua sau khi v25 quét xong', 'v25 hay để trống MST hoặc lấy nhầm MST bên bán ở vài mẫu hóa đơn (Fast, 1C26MWX, K26T…). Tên đơn vị mua là công ty mình (hoặc tên file có MST) thì điền đúng MST; ô đã sửa được tô vàng và ghi chú trong Ket_Qua.xlsx', S.fixMst, function (v) { S.fixMst = v; U.store.set('fix_mst', v); }),
        N.err ? U.banner('err', '', N.err) : null,
        h('div', { style: 'display:flex;gap:10px;flex-wrap:wrap' },
          h('button.btn.primary', { type: 'button', disabled: running || !v25 || N.busy, onclick: async function () {
            if (!N.folder.trim()) { N.err = 'Nhập thư mục cần quét.'; region.update(); return; }

  function build() {

        U.check('Tự sửa MST bên mua theo tên công ty', 'Ô MST trống hoặc lấy nhầm MST bên bán, mà tên đơn vị mua là THP, LH, LH-THP, S7 (hoặc tên file có MST) thì điền đúng MST. Ô đã sửa có viền xanh', S.fixMst, function (v) { S.fixMst = v; U.store.set('fix_mst', v); }),

  function mstView(region) {
    function save() { U.store.set('mst', S.mst); }
    return [
      h('p.muted', 'Bản Python đổi mã số thuế bên mua thành tên viết tắt (ví dụ 0309868627 → THP) trước khi xuất Excel. Sửa bảng này cho khớp các công ty của bạn; bảng được nhớ trong trình duyệt này.'),

          h('div.card', { style: 'box-shadow:none' }, h('h2', 'Thư mục sẽ được tạo'), h('div.foot-note', U.fmt.int(fnames.length) + ' thư mục theo biển số'),
            fnames.length ? h('ul.list-plain', fnames.slice(0, 5).map(function (f) { return h('li', h('span.mono', f), h('span.muted', folders[f] + ' file')); }), fnames.length > 5 ? h('li', h('span.muted', 'và ' + (fnames.length - 5) + ' thư mục khác')) : null) : h('div.muted', 'Chưa có.')),
          unmatched.length ? h('div.card', { style: 'box-shadow:none' }, h('h2', 'Chưa khớp'), h('div.foot-note', cnt.none + ' dòng. ' + Math.min(5, cnt.none) + ' tên đầu tiên:'),
            h('ul.list-plain', unmatched.map(function (r) { return h('li', h('span.mono', r.ten)); })), h('div.foot-note', 'Kiểm tra lại tên file hoặc vị trí lưu.')) : null)),
      S.progress ? U.progress('Đang di chuyển file', S.progress[0], S.progress[1]) : null,
      h('div.toolbar', h('span.foot-note', canMove ? 'Trình duyệt sẽ hỏi quyền chỉnh sửa thư mục khi bạn bấm Xếp file.' : 'Thư mục thật được chọn bằng nút ở mục 2.'),
        h('div', { style: 'display:flex;gap:10px;flex-wrap:wrap' },
          h('button.btn', { type: 'button', onclick: function () { U.save('bao_cao_xep_file_' + U.stamp() + '.csv', L.toCSV([['Tên trong Excel', 'Biển số', 'File tìm thấy', 'Kiểu khớp', 'Thư mục đích']].concat(list.map(function (r) { return [r.ten, r.bs, r.file ? r.file.name : '', KIND[r.kind][1], r.folder]; })))); } }, U.icon('download', 16), 'Xuất báo cáo (CSV)'),
          h('button.btn', { type: 'button', disabled: sample || S.busy || !matched, onclick: function () { makeZip(region); } }, U.icon('download', 16), S.busy ? 'Đang xử lý…' : 'Tải ZIP đã xếp'),
          canMove ? U.confirmButton('Xếp file', 'Bấm lần nữa để di chuyển ' + matched + ' file', 'primary', function () { moveAll(region); }) : h('button.btn.primary', { type: 'button', disabled: true, title: sample ? 'Đang dùng dữ liệu mẫu' : 'Cần chọn thư mục bằng nút ở mục 2' }, 'Xếp file')))
    ];
  }

  root.PageBienSo = { build: build };
})(window);

</script>
<script>
/* Khung ứng dụng: thanh bên, chuyển trang, trạng thái môi trường */
(function (root) {
  'use strict';
  var U = root.UI, h = U.h, B = root.Browser;
  var LOCAL = !!(root.Local && root.Local.on);
  // Chạy cùng app.py: menu theo trình tự công việc (1 Gmail -> 2 Petrolimex -> 3 Kết quả), thêm trang Công cụ.
  // Mở file HTML trực tiếp: giữ 5 màn hình như cũ.
  var PAGES = LOCAL ? [
    { id: 'gmail', group: 'Hằng ngày', step: 1, label: 'Tải hóa đơn Gmail', icon: 'mail', mod: 'PageGmail' },
    { id: 'petro', group: 'Hằng ngày', step: 2, label: 'Hóa đơn Petrolimex', icon: 'drop', mod: 'PagePetro' },
    { id: 'ketqua', group: 'Hằng ngày', step: 3, label: 'Kết quả & Tổng hợp', icon: 'table', mod: 'PageKetQua' },
    { id: 'quet', group: 'Xử lý file', label: 'Quét hóa đơn → Excel', icon: 'table', mod: 'PageQuet' },
    { id: 'anh-pdf', group: 'Xử lý file', label: 'Ảnh → PDF', icon: 'image', mod: 'PageAnhPdf' },
    { id: 'bien-so', group: 'Xử lý file', label: 'Xếp theo biển số', icon: 'folder', mod: 'PageBienSo' },
    { id: 'congcu', group: 'Khác', label: 'Công cụ & profile', icon: 'tool', mod: 'PageCongCu' }
  ] : [
    { id: 'gmail', group: 'Thu thập', label: 'Tải hóa đơn Gmail', icon: 'mail', mod: 'PageGmail' },
    { id: 'petro', group: 'Thu thập', label: 'Hóa đơn Petrolimex', icon: 'drop', mod: 'PagePetro' },
    { id: 'anh-pdf', group: 'Xử lý file', label: 'Ảnh → PDF', icon: 'image', mod: 'PageAnhPdf' },
    { id: 'quet', group: 'Xử lý file', label: 'Quét hóa đơn → Excel', icon: 'table', mod: 'PageQuet' },
    { id: 'bien-so', group: 'Xử lý file', label: 'Xếp theo biển số', icon: 'folder', mod: 'PageBienSo' }
  ];
  var built = {}, onShow = {}, current = null, navLinks = {}, navBadges = {};

  function envChips() {
    var pdf = !!root.pdfjsLib, ocrLib = !!root.Tesseract, st = B.ocrState();
    var inArtifact = !!(root.claude && root.claude.use);
    return h('div.side-foot',
      h('div.row', h('span', 'Đọc PDF'), U.badge(pdf ? 'ok' : 'err', pdf ? 'Sẵn sàng' : 'Chưa nạp')),
      h('div.row', h('span', 'OCR'), U.badge(st.state === 'ready' ? 'ok' : st.state === 'failed' ? 'err' : ocrLib ? 'info' : 'warn', st.state === 'ready' ? 'Sẵn sàng' : st.state === 'failed' ? 'Không dùng được' : ocrLib ? (U.isLocalFile ? 'Tải khi cần' : 'Chỉ khi mở file') : 'Chưa nạp')),
      h('div.row', h('span', 'Lưu file'), U.badge('info', inArtifact ? 'Hộp thoại lưu' : 'Tải xuống')),
      h('div.muted', 'Dữ liệu chỉ xử lý trong trình duyệt của bạn, không gửi đi đâu.'));
  }

  // Số đếm nhắc việc cạnh tên trang: hóa đơn Petro chờ tải, hóa đơn lỗi / PDF chưa quét
  function updateBadges() {
    if (!LOCAL) return;
    var p = root.Local.profileInfo() || {}, f = p.folders || {};
    function set(id, n, kind, title) {
      var b = navBadges[id]; if (!b) return;
      b.textContent = n ? U.fmt.int(n) : '';
      b.className = 'nav-badge' + (kind ? ' ' + kind : '');
      if (n) b.setAttribute('title', title); else b.removeAttribute('title');
    }
    set('petro', p.petro_todo || 0, 'warn', 'hóa đơn chờ tải PDF');
    var err = root.PageGmail && root.PageGmail.reportTodo ? root.PageGmail.reportTodo().length : 0;
    if (err) set('ketqua', err, 'err', 'hóa đơn lỗi cần tải lại');
    else set('ketqua', f.kh_new || 0, 'warn', 'PDF chưa có XML, chưa quét v25');
  }

  function show(id, fromHash) {
    var page = PAGES.filter(function (p) { return p.id === id; })[0] || PAGES[0];
    id = page.id;
    if (!built[id]) {
      var wrap = h('div', { style: 'display:contents', 'data-page': id });
      try {
        var r = root[page.mod].build();
        var el = r && r.el ? r.el : r;
        wrap.appendChild(el);
        mainEl.appendChild(wrap);
        built[id] = wrap;
        if (r && r.onShow) onShow[id] = r.onShow;
        if (r && r.init) r.init().catch(function (e) { U.toast('Lỗi tải dữ liệu mẫu: ' + (e.message || e)); });
      } catch (e) {
        wrap.appendChild(U.banner('err', 'Không dựng được trang này.', String(e && e.stack || e)));
        mainEl.appendChild(wrap); built[id] = wrap;
      }
    } else if (onShow[id] && current !== id) {
      try { onShow[id](); } catch (e) { /* bỏ qua */ }
    }
    Object.keys(built).forEach(function (k) { built[k].hidden = k !== id; });
    Object.keys(navLinks).forEach(function (k) { if (k === id) navLinks[k].setAttribute('aria-current', 'page'); else navLinks[k].removeAttribute('aria-current'); });
    document.title = page.label + ' · Bộ công cụ hóa đơn';
    current = id;
    if (!fromHash) { try { history.replaceState(null, '', '#' + id); } catch (e) { try { location.hash = id; } catch (e2) { /* bỏ qua */ } } }
    window.scrollTo(0, 0);
  }

  var mainEl = h('main.main', { id: 'main' });
  function mount(rootEl) {
    var groups = {}, order = [];
    PAGES.forEach(function (p) { if (!groups[p.group]) { groups[p.group] = []; order.push(p.group); } groups[p.group].push(p); });
    var nav = h('nav.nav', { 'aria-label': 'Công cụ' }, order.map(function (g) {
      return h('div.nav-group', h('div.nav-title', g), groups[g].map(function (p) {
        var badge = navBadges[p.id] = h('span.nav-badge');
        var a = h('a', { href: '#' + p.id, onclick: function (e) { e.preventDefault(); show(p.id); } },
          p.step ? h('span.stepno', { 'aria-hidden': 'true' }, String(p.step)) : U.icon(p.icon, 20), h('span', p.label), badge);
        navLinks[p.id] = a; return a;
      }));
    }));
    var footHolder = h('div', { style: 'display:contents' }, LOCAL ? root.Local.sideCard() : envChips());
    if (!LOCAL) B.ocrListeners.push(function () { footHolder.textContent = ''; footHolder.appendChild(envChips()); });
    var side = h('aside.side',
      h('div.brand', h('span.brand-mark', U.icon('mark', 20)), h('div', h('b', 'Bộ công cụ hóa đơn'), h('span', LOCAL ? 'Đang chạy cùng app.py' : '5 màn hình xử lý'))),
      LOCAL ? root.Local.sideProfile() : null,
      nav, footHolder);
    rootEl.appendChild(h('div.app', side, mainEl));
    if (LOCAL) {
      root.Local.subscribe(function (ev) { if (ev !== 'lines' && ev !== 'petro') updateBadges(); });
      if (root.PageGmail && root.PageGmail.onData) { root.PageGmail.onData(updateBadges); root.PageGmail.wire(); }
    }
    window.addEventListener('hashchange', function () { var id = (location.hash || '').replace(/^#/, ''); if (id && id !== current) show(id, true); });
    var start = (location.hash || '').replace(/^#/, '');
    show(PAGES.some(function (p) { return p.id === start; }) ? start : 'gmail', true);
    updateBadges();
    if (!LOCAL) setTimeout(function () { footHolder.textContent = ''; footHolder.appendChild(envChips()); }, 1500);
  }
  root.App = { mount: mount, show: show };
})(window);

</script>
<script>window.App.mount(document.getElementById("root"));</script>
</body>
